# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, v4, v3_3]
  pull_request:
    branches: [main, master, v4, v3_3]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ${{ matrix.config.lib}})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release', lib: "tbb"}
          - {os: windows-latest, r: 'release', lib: "tbb"}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release', lib: "tbb"}
          - {os: ubuntu-latest,   r: 'release',  lib: "tbb"}
          - {os: ubuntu-latest,   r: 'oldrel-1', lib: "tbb"}
          - {os: ubuntu-latest,   r: 'release',  lib: "no-tbb"}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    
    steps:
      - if: matrix.config.os == 'ubuntu-latest' && matrix.config.lib == 'tbb'
        run: |
            sudo apt update
            sudo apt install libtbb-dev
      - if: matrix.config.os == 'macos-latest' && matrix.config.lib == 'tbb'
        run: |
            brew update
            brew install tbb
        
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-vignettes", "--no-manual", "--as-cran")'
          upload-snapshots: true
